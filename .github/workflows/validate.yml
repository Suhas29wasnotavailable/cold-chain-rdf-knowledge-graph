name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Vocabulary, domain/range checks and SPARQL queries
        run: python validate.py
      - name: Committed results.txt matches a fresh run
        run: git diff --exit-code results.txt
      - name: N-Triples / JSON-LD / RDF/XML exports match the Turtle source
        run: python export_formats.py --check
      - name: SHACL shapes
        run: python shacl_check.py
      - name: Competency-question answers
        run: pytest -q tests
