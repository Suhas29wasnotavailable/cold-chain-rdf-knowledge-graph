name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Vocabulary, domain/range checks and SPARQL queries
        run: python validate.py
      - name: Committed results.txt matches a fresh run
        run: git diff --exit-code results.txt
